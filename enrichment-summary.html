<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ход досбора</title>
<style>
  :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
  body { margin: 16px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { margin: 6px 0; }
  progress { width: 100%; }
  dl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 12px 0 0; }
  dt { font-size: 12px; }
  dd { overflow-wrap: anywhere; }
  @media (max-width: 360px) {
    dl { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  details { margin-top: 14px; }
  summary { cursor: pointer; }
  form { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-top: 8px; }
  form label { display: grid; gap: 3px; }
  input[type=number] { width: 7ch; }
  dd { margin: 2px 0 0; font-weight: 650; font-variant-numeric: tabular-nums; }
</style>
<script src="enrichment-summary.js" defer></script>
</head>
<body>
<main>
  <h1>Ход досбора</h1>
  <p id="status" role="status">Загрузка…</p>
  <progress id="progress" max="1" value="0" aria-label="Прогресс досбора"></progress>
  <dl>
    <div><dt>Собрано за прогон</dt><dd id="success">—</dd></div>
    <div><dt>Осталось</dt><dd id="remaining">—</dd></div>
    <div><dt>Ошибки</dt><dd id="errors">—</dd></div>
    <div><dt>Сохранено всего</dt><dd id="saved">—</dd></div>
    <div><dt>Прошло</dt><dd id="elapsed">—</dd></div>
    <div><dt>До конца, оценка</dt><dd id="eta">—</dd></div>
    <div><dt>Последнее сохранение</dt><dd id="lastSaved">—</dd></div>
  </dl>
  <details id="windowSize">
    <summary>Размер окон</summary>
    <form id="resizeForm">
      <label>Окно <select id="resizeTarget"></select></label>
      <label>Ширина <input id="resizeWidth" type="number" min="1" max="32768" required></label>
      <label>Высота <input id="resizeHeight" type="number" min="1" max="32768" required></label>
      <button type="submit" id="resizeApply" disabled>Применить</button>
    </form>
    <p id="resizeStatus" role="status"></p>
  </details>
</main>
</body>
</html>
