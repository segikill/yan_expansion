<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Maps Export Overlay</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 360px;
      margin: 0;
      padding: 14px;
      color: #101828;
      background: #fff;
      font: 13px/1.35 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .head { display:flex; align-items:center; justify-content:space-between; margin-bottom: 12px; }
    .title { font-weight: 800; letter-spacing: -.02em; }
    .source { color: #667085; font-size: 12px; }
    .stats { display:grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-bottom: 10px; }
    .card { border:1px solid #EAECF0; background:#F9FAFB; border-radius: 14px; padding: 9px 8px; }
    .card b { display:block; font-size: 20px; line-height: 1; letter-spacing: -.04em; }
    .card span { display:block; margin-top: 5px; color:#667085; font-size: 11px; }
    .actions { display:grid; gap:7px; }
    button { height:36px; border:0; border-radius:12px; cursor:pointer; font:800 12px/1 system-ui, -apple-system, Segoe UI, Arial, sans-serif; text-transform: uppercase; }
    button.primary { background:#175CD3; color:white; }
    button.primary:hover { background:#1849A9; }
    button.secondary { background:#F2F4F7; color:#344054; }
    button.secondary:hover { background:#E4E7EC; }
    button.danger { background:#FFF1F3; color:#C01048; }
    button:disabled { opacity:.55; cursor:default; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
    .status { min-height: 18px; margin-top: 10px; color:#667085; font-size: 12px; }
  </style>
</head>
<body>
  <div class="head">
    <div>
      <div class="title">Maps Export</div>
      <div class="source" id="source">overlay</div>
    </div>
  </div>

  <div class="stats">
    <div class="card"><b id="currentCount">0</b><span>сейчас</span></div>
    <div class="card"><b id="sessionCount">0</b><span>всего</span></div>
    <div class="card"><b id="snapshotCount">0</b><span>фиксаций</span></div>
    <div class="card"><b id="detailCount">0</b><span>деталей</span></div>
  </div>

  <div class="actions">
    <button id="btnShowPanel" class="primary">Показать панель</button>
    <button id="btnEnrichment" class="secondary">Дособрать данные по URL</button>
    <div class="row">
      <button id="btnExport" class="secondary">XLSX</button>
      <button id="btnClear" class="danger">Сброс</button>
    </div>
  </div>

  <div id="status" class="status"></div>

  <script src="xlsx.full.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
